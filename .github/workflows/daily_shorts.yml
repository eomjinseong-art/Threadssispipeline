# 유튜브 쇼츠 파이프라인은 중단됨.
# 스케줄을 제거해서 영상 생성/업로드가 더 이상 돌지 않게 한다.
# 실제 배포는 daily_threads.yml 을 사용한다.
name: daily-shorts-pipeline

on:
  workflow_dispatch:
    inputs:
      notice:
        description: "Retired. Use daily-threads-pipeline instead."
        required: false

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: YouTube 파이프라인 중단 안내
        run: |
          echo "YouTube 쇼츠 생성/업로드는 중단되었습니다."
          echo "스레드 배포는 daily-threads-pipeline 워크플로를 사용하세요."
