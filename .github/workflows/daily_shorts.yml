# 유튜브 쇼츠 파이프라인
# 한국시간 오전 9시 / 오후 6시 / 오후 9시 = UTC 00:00 / 09:00 / 12:00
name: daily-shorts-pipeline

on:
  schedule:
    - cron: "0 0,9,12 * * *"
  workflow_dispatch: {}

jobs:
  shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ffmpeg 및 한글 폰트 설치
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-nanum fonts-nanum-extra

      - name: 파이썬 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 단위 테스트
        run: python -m unittest discover -s tests

      - name: "0단계: 사연 재고 자동 보충 (조건부)"
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
        run: python generate_more_stories.py

      - name: "대기 사연 → Shorts 렌더 → YouTube 업로드"
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: utf-8
          GOOGLE_SHEETS_CREDENTIALS: ${{ secrets.GOOGLE_SHEETS_CREDENTIALS }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YOUTUBE_CLIENT_SECRET_JSON: ${{ secrets.YOUTUBE_CLIENT_SECRET_JSON }}
          EXPECTED_YOUTUBE_CHANNEL_ID: ${{ secrets.EXPECTED_YOUTUBE_CHANNEL_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python make_shorts.py

      - name: 렌더된 mp4 아티팩트 업로드
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shorts-output-${{ github.run_id }}
          path: |
            output/*.mp4
            output/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: 실패 알림 (Slack)
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -s -X POST -H 'Content-type: application/json' \
              --data "{\"text\":\":rotating_light: 쇼츠 파이프라인 실패. 로그: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
              "$SLACK_WEBHOOK_URL"
          fi
