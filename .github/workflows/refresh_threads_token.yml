name: refresh-threads-token

# Threads long-lived 토큰은 약 60일이다. 만료 전에 매주 갱신한다.
# 월요일 03:17 UTC = 한국시간 12:17.
# 토큰 값은 로그에 출력하지 않는다.
on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Threads long-lived 토큰 갱신
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          SECRETS_WRITE_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
          GH_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
        run: |
          set -euo pipefail
          token_file="$(mktemp)"
          chmod 600 "$token_file"
          trap 'rm -f "$token_file"' EXIT

          set +e
          python3 - "$token_file" << 'PY'
          import http.client
          import json
          import os
          import sys
          import urllib.parse

          HOST = "graph.threads.net"
          PATH = "/refresh_access_token"


          def safe_label(value: object) -> str:
              text = "" if value is None else str(value)
              allowed = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789_-"
              if not text or len(text) > 40 or any(ch not in allowed for ch in text):
                  return "unavailable"
              return text


          def workflow_escape(value: str) -> str:
              return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")


          def main() -> int:
              old = os.environ.get("THREADS_ACCESS_TOKEN", "")
              if not old.strip():
                  print(
                      "::error::THREADS_ACCESS_TOKEN is empty, so the refresh API was not called.",
                      file=sys.stderr,
                  )
                  return 1

              query = urllib.parse.urlencode(
                  {
                      "grant_type": "th_refresh_token",
                      "access_token": old,
                  }
              )
              request_path = f"{PATH}?{query}"
              conn = None
              try:
                  conn = http.client.HTTPSConnection(HOST, timeout=30)
                  conn.request("GET", request_path, headers={"User-Agent": "threads-token-refresh"})
                  resp = conn.getresponse()
                  status = resp.status
                  raw = resp.read()
              except Exception:
                  print("::error::Threads refresh API request failed.", file=sys.stderr)
                  return 1
              finally:
                  if conn is not None:
                      try:
                          conn.close()
                      except Exception:
                          pass

              payload = None
              try:
                  payload = json.loads(raw.decode())
              except Exception:
                  payload = None

              if status < 200 or status >= 300 or not isinstance(payload, dict):
                  err = payload.get("error") if isinstance(payload, dict) else None
                  err_type = safe_label(err.get("type")) if isinstance(err, dict) else "unavailable"
                  code = safe_label(err.get("code")) if isinstance(err, dict) else "unavailable"
                  print(
                      f"::error::Threads refresh API failed (HTTP {status}, type={err_type}, code={code}).",
                      file=sys.stderr,
                  )
                  return 1

              new = payload.get("access_token")
              if not isinstance(new, str) or not new or any(ch.isspace() or ord(ch) < 32 for ch in new):
                  print(
                      "::error::Threads refresh API response did not include a usable access_token.",
                      file=sys.stderr,
                  )
                  return 1

              # Mask before any later step can log the value. The runner redacts this command.
              print(f"::add-mask::{workflow_escape(new)}")
              expires = payload.get("expires_in")
              if isinstance(expires, bool) or not isinstance(expires, (int, float)):
                  print("Threads refresh API succeeded.")
              else:
                  print(f"Threads refresh API succeeded (expires_in={int(expires)}).")

              token_path = sys.argv[1]
              with open(token_path, "w", encoding="utf-8") as handle:
                  handle.write(new)
              os.chmod(token_path, 0o600)
              return 0


          try:
              sys.exit(main())
          except SystemExit:
              raise
          except Exception:
              print("::error::Threads token refresh failed unexpectedly.", file=sys.stderr)
              sys.exit(1)
          PY
          api_status=$?
          set -e

          if [ -z "${SECRETS_WRITE_TOKEN:-}" ]; then
            if [ "$api_status" -ne 0 ]; then
              echo "::warning::SECRETS_WRITE_TOKEN 이 없습니다. 갱신 API가 실패했고, 새 토큰을 저장할 PAT도 없습니다. 이 저장소 Secrets 읽기/쓰기 권한이 있는 fine-grained PAT를 SECRETS_WRITE_TOKEN 으로 저장하세요."
            else
              echo "::warning::SECRETS_WRITE_TOKEN 이 없습니다. 토큰 갱신에는 성공했지만 THREADS_ACCESS_TOKEN 에 저장하지 않았습니다. 이 저장소 Secrets 읽기/쓰기 권한이 있는 fine-grained PAT를 SECRETS_WRITE_TOKEN 으로 저장하세요."
            fi
          fi

          if [ "$api_status" -ne 0 ]; then
            exit "$api_status"
          fi

          if [ -z "${SECRETS_WRITE_TOKEN:-}" ]; then
            exit 0
          fi

          if [ ! -s "$token_file" ]; then
            echo "::error::Threads refresh API succeeded but the new token file is empty."
            exit 1
          fi

          gh secret set THREADS_ACCESS_TOKEN -R "${{ github.repository }}" < "$token_file"
          echo "Updated THREADS_ACCESS_TOKEN secret."
