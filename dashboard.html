<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스레드 자동 배포 콘솔</title>
<style>
  :root{
    --bg:#0B0D10; --panel:#14171C; --panel-2:#1B1F26; --border:#2A2F38;
    --text:#E8E6E0; --text-dim:#8B8880; --amber:#F2B33D;
    --green:#5DCB8F; --red:#E2574C; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Pretendard,sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text); font-family:var(--sans);
    padding:32px 20px 80px; line-height:1.6;
  }
  .wrap{max-width:760px; margin:0 auto;}
  .sign{display:flex; align-items:center; gap:10px; margin-bottom:6px;}
  .dot{width:9px; height:9px; border-radius:50%; background:var(--text-dim); flex-shrink:0;}
  .dot.ok{background:var(--green); box-shadow:0 0 8px var(--green);}
  .dot.bad{background:var(--red); box-shadow:0 0 8px var(--red);}
  h1{font-size:20px; font-weight:600; margin:0; letter-spacing:0.3px;}
  .sub{color:var(--text-dim); font-size:13px; margin:0 0 28px;}
  .panel{
    background:var(--panel); border:1px solid var(--border); border-radius:10px;
    padding:20px; margin-bottom:16px;
  }
  .panel h2{
    font-size:13px; font-weight:600; text-transform:uppercase; letter-spacing:0.6px;
    color:var(--text-dim); margin:0 0 16px;
  }
  input[type=text], input[type=password]{
    width:100%; background:var(--panel-2); border:1px solid var(--border); color:var(--text);
    padding:9px 11px; border-radius:6px; font-size:13px; font-family:var(--mono);
  }
  input::placeholder{color:var(--text-dim);}
  label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:5px;}
  .field{margin-bottom:12px;}
  button{
    font-family:var(--sans); font-size:13px; font-weight:600; border:none; border-radius:6px;
    padding:9px 16px; cursor:pointer;
  }
  button:hover{opacity:0.85;}
  button:disabled{opacity:0.35; cursor:not-allowed;}
  .btn-primary{background:var(--amber); color:#1A1300;}
  .btn-ghost{background:var(--panel-2); color:var(--text); border:1px solid var(--border);}
  .btn-run{
    width:100%; background:var(--amber); color:#1A1300; font-size:15px; padding:14px;
    border-radius:8px;
  }
  .checklist{display:flex; flex-direction:column;}
  .check-item{
    display:flex; align-items:center; gap:10px; padding:9px 0; border-bottom:1px solid var(--border);
    font-size:13px;
  }
  .check-item:last-child{border-bottom:none;}
  .check-mark{
    width:18px; height:18px; border-radius:5px; flex-shrink:0; display:flex; align-items:center;
    justify-content:center; font-size:11px; font-family:var(--mono);
    background:var(--panel-2); border:1px solid var(--border); color:var(--text-dim);
  }
  .check-mark.ok{background:rgba(93,203,143,0.15); border-color:var(--green); color:var(--green);}
  .check-mark.bad{background:rgba(226,87,76,0.12); border-color:var(--red); color:var(--red);}
  .check-label{flex:1;}
  .check-optional{color:var(--text-dim); font-size:11px;}
  .run-row{display:flex; gap:10px; align-items:center; margin-bottom:14px;}
  .run-row label{margin:0; white-space:nowrap;}
  .run-row input{max-width:120px;}
  .runs{display:flex; flex-direction:column; gap:8px;}
  .run-card{
    display:flex; align-items:center; gap:10px; padding:10px 12px; background:var(--panel-2);
    border:1px solid var(--border); border-radius:8px; font-size:12px; font-family:var(--mono);
  }
  .run-status{padding:2px 8px; border-radius:4px; font-size:11px; font-weight:600; flex-shrink:0;}
  .run-status.success{background:rgba(93,203,143,0.15); color:var(--green);}
  .run-status.failure{background:rgba(226,87,76,0.15); color:var(--red);}
  .run-status.progress{background:rgba(242,179,61,0.15); color:var(--amber);}
  .run-status.other{background:var(--panel); color:var(--text-dim);}
  .run-time{color:var(--text-dim); flex:1;}
  .run-link{color:var(--amber); text-decoration:none;}
  .msg{font-size:12px; margin-top:10px; padding:9px 11px; border-radius:6px; font-family:var(--mono);}
  .msg.error{background:rgba(226,87,76,0.1); color:var(--red); border:1px solid rgba(226,87,76,0.3);}
  .msg.success{background:rgba(93,203,143,0.1); color:var(--green); border:1px solid rgba(93,203,143,0.3);}
  .msg.info{background:var(--panel-2); color:var(--text-dim); border:1px solid var(--border);}
  .hint{font-size:11px; color:var(--text-dim); margin-top:10px;}
  .empty{color:var(--text-dim); font-size:13px; text-align:center; padding:16px 0;}
</style>
</head>
<body>
<div class="wrap">
  <div class="sign">
    <span class="dot" id="conn-dot"></span>
    <h1>쇼츠 자동 배포 콘솔</h1>
  </div>
  <p class="sub">구글 시트 대기 사연으로 Shorts를 만들고 YouTube에 올립니다. Threads 스케줄 배포는 수동입니다.</p>

  <div class="panel">
    <h2>리포지토리 연결</h2>
    <div class="field">
      <label>owner/repo</label>
      <input type="text" id="repo-input" placeholder="eomjinseong-art/Threadssispipeline">
    </div>
    <div class="field">
      <label>GitHub Personal Access Token (Actions, Secrets 권한)</label>
      <input type="password" id="pat-input" placeholder="ghp_...">
    </div>
    <button class="btn-primary" id="connect-btn">연결 확인</button>
    <div id="connect-msg"></div>
    <p class="hint">토큰은 이 브라우저에만 저장되며 GitHub API 호출에만 쓰입니다.</p>
  </div>

  <div class="panel" id="checklist-panel" style="display:none;">
    <h2>시크릿 체크</h2>
    <div class="checklist" id="checklist"></div>
    <button class="btn-ghost" id="recheck-btn" style="margin-top:14px;">다시 확인</button>
  </div>

  <div class="panel" id="run-panel" style="display:none;">
    <h2>실행</h2>
    <div class="run-row">
      <label>브랜치</label>
      <input type="text" id="branch-input" value="main">
      <button class="btn-ghost" id="refresh-runs-btn">최근 실행 새로고침</button>
    </div>
    <button class="btn-run" id="run-btn">지금 쇼츠 만들기</button>
    <div id="run-msg"></div>
  </div>

  <div class="panel" id="history-panel" style="display:none;">
    <h2>최근 실행</h2>
    <div class="runs" id="runs-list"><div class="empty">아직 조회한 실행 이력이 없습니다.</div></div>
  </div>
</div>

<script>
(function(){
  "use strict";

  var REQUIRED_SECRETS = [
    {name:"GOOGLE_SHEETS_CREDENTIALS", label:"구글 시트 서비스 계정 JSON"},
    {name:"YOUTUBE_TOKEN_JSON", label:"YouTube token.json"},
    {name:"YOUTUBE_CLIENT_SECRET_JSON", label:"YouTube OAuth 클라이언트 JSON", optional:true},
    {name:"YOUTUBE_REFRESH_TOKEN", label:"YouTube refresh token", optional:true},
    {name:"EXPECTED_YOUTUBE_CHANNEL_ID", label:"업로드 허용 채널 ID", optional:true},
    {name:"OPENAI_API_KEY", label:"OpenAI API 키 (사연 재고 보충)", optional:true},
    {name:"THREADS_ACCESS_TOKEN", label:"Threads 액세스 토큰 (홍보)", optional:true},
    {name:"THREADS_USER_ID", label:"Threads 사용자 ID (홍보)", optional:true},
    {name:"SLACK_WEBHOOK_URL", label:"Slack 웹훅 (실패 알림)", optional:true}
  ];
  var WORKFLOW_FILE = "daily_shorts.yml";
  var state = { owner:"", repo:"", pat:"", connected:false };

  async function storeGet(key){
    try{ if (window.storage){ var r = await window.storage.get(key, false); return r ? r.value : null; } }catch(e){}
    try{ return localStorage.getItem(key); }catch(e){ return null; }
  }
  async function storeSet(key, value){
    try{ if (window.storage){ await window.storage.set(key, value, false); return; } }catch(e){}
    try{ localStorage.setItem(key, value); }catch(e){}
  }
  function el(id){ return document.getElementById(id); }
  function showMsg(container, text, type){
    container.innerHTML = '<div class="msg ' + type + '">' + text + '</div>';
  }
  async function gh(path, options){
    options = options || {};
    var headers = Object.assign({
      "Authorization": "Bearer " + state.pat,
      "Accept": "application/vnd.github+json",
      "X-GitHub-Api-Version": "2022-11-28"
    }, options.headers || {});
    return fetch("https://api.github.com" + path, Object.assign({}, options, {headers: headers}));
  }

  el("connect-btn").addEventListener("click", async function(){
    var repoVal = el("repo-input").value.trim();
    var patVal = el("pat-input").value.trim();
    var msgBox = el("connect-msg");
    var parts = repoVal.split("/");
    if (parts.length !== 2 || !patVal){
      showMsg(msgBox, "owner/repo 형식과 토큰을 모두 입력하세요.", "error");
      return;
    }
    state.owner = parts[0]; state.repo = parts[1]; state.pat = patVal;
    showMsg(msgBox, "연결 확인 중...", "info");
    try{
      var res = await gh("/repos/" + state.owner + "/" + state.repo);
      if (!res.ok){
        state.connected = false;
        el("conn-dot").className = "dot bad";
        showMsg(msgBox, "연결 실패 (" + res.status + "). owner/repo 또는 토큰 권한을 확인하세요.", "error");
        return;
      }
      state.connected = true;
      el("conn-dot").className = "dot ok";
      showMsg(msgBox, "연결됨: " + state.owner + "/" + state.repo, "success");
      await storeSet("gh_config", JSON.stringify({owner: state.owner, repo: state.repo, pat: state.pat}));
      el("checklist-panel").style.display = "block";
      el("run-panel").style.display = "block";
      el("history-panel").style.display = "block";
      await runChecklist();
      await refreshRuns();
    }catch(e){
      state.connected = false;
      el("conn-dot").className = "dot bad";
      showMsg(msgBox, "요청 중 오류: " + e.message, "error");
    }
  });

  async function runChecklist(){
    var box = el("checklist");
    box.innerHTML = '<div class="empty">확인 중...</div>';
    var existingSecretNames = new Set();
    var warnings = [];
    try{
      var secRes = await gh("/repos/" + state.owner + "/" + state.repo + "/actions/secrets");
      if (secRes.ok){
        var secData = await secRes.json();
        (secData.secrets || []).forEach(function(s){ existingSecretNames.add(s.name); });
      } else {
        warnings.push("시크릿 목록 조회 실패: HTTP " + secRes.status);
      }
    }catch(e){
      warnings.push("시크릿 조회 오류: " + e.message);
    }
    box.innerHTML = "";
    if (warnings.length){
      var warnBox = document.createElement("div");
      warnBox.className = "msg error";
      warnBox.style.marginBottom = "12px";
      warnBox.textContent = warnings.join(" / ");
      box.appendChild(warnBox);
    }
    REQUIRED_SECRETS.forEach(function(s){
      var row = document.createElement("div");
      row.className = "check-item";
      var ok = existingSecretNames.has(s.name);
      var mark = document.createElement("div");
      mark.className = "check-mark " + (ok ? "ok" : "bad");
      mark.textContent = ok ? "OK" : "X";
      var label = document.createElement("div");
      label.className = "check-label";
      label.textContent = "시크릿: " + s.label;
      row.appendChild(mark);
      row.appendChild(label);
      if (s.optional){
        var opt = document.createElement("span");
        opt.className = "check-optional";
        opt.textContent = "선택";
        row.appendChild(opt);
      }
      box.appendChild(row);
    });
  }
  el("recheck-btn").addEventListener("click", runChecklist);

  el("run-btn").addEventListener("click", async function(){
    var branch = el("branch-input").value.trim() || "main";
    var msgBox = el("run-msg");
    var btn = el("run-btn");
    btn.disabled = true; btn.textContent = "요청 중...";
    try{
      var res = await gh("/repos/" + state.owner + "/" + state.repo + "/actions/workflows/" + WORKFLOW_FILE + "/dispatches", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ref: branch})
      });
      if (res.ok || res.status === 204){
        showMsg(msgBox, "실행을 요청했습니다. 잠시 후 아래 실행 이력에 나타납니다.", "success");
        setTimeout(refreshRuns, 4000);
      } else {
        showMsg(msgBox, "실행 요청 실패 (" + res.status + "). 브랜치명과 워크플로 파일을 확인하세요.", "error");
      }
    }catch(e){
      showMsg(msgBox, "요청 중 오류: " + e.message, "error");
    }
    btn.disabled = false; btn.textContent = "지금 쇼츠 만들기";
  });

  async function refreshRuns(){
    var list = el("runs-list");
    try{
      var res = await gh("/repos/" + state.owner + "/" + state.repo + "/actions/workflows/" + WORKFLOW_FILE + "/runs?per_page=5");
      if (!res.ok){
        list.innerHTML = '<div class="empty">실행 이력을 불러오지 못했습니다. 워크플로 파일이 GitHub에 올라갔는지 확인하세요.</div>';
        return;
      }
      var data = await res.json();
      var runs = data.workflow_runs || [];
      if (!runs.length){
        list.innerHTML = '<div class="empty">아직 실행 이력이 없습니다.</div>';
        return;
      }
      list.innerHTML = "";
      runs.forEach(function(run){
        var card = document.createElement("div");
        card.className = "run-card";
        var statusClass = "other";
        var statusText = run.status;
        if (run.status === "in_progress" || run.status === "queued"){ statusClass = "progress"; statusText = "진행중"; }
        else if (run.conclusion === "success"){ statusClass = "success"; statusText = "성공"; }
        else if (run.conclusion === "failure"){ statusClass = "failure"; statusText = "실패"; }
        else if (run.conclusion){ statusText = run.conclusion; }
        var statusEl = document.createElement("span");
        statusEl.className = "run-status " + statusClass;
        statusEl.textContent = statusText;
        var timeEl = document.createElement("span");
        timeEl.className = "run-time";
        timeEl.textContent = new Date(run.created_at).toLocaleString("ko-KR");
        var linkEl = document.createElement("a");
        linkEl.className = "run-link";
        linkEl.href = run.html_url;
        linkEl.target = "_blank";
        linkEl.rel = "noopener";
        linkEl.textContent = "로그 보기";
        card.appendChild(statusEl);
        card.appendChild(timeEl);
        card.appendChild(linkEl);
        list.appendChild(card);
      });
      if (runs.some(function(r){ return r.status === "in_progress" || r.status === "queued"; })){
        setTimeout(refreshRuns, 15000);
      }
    }catch(e){
      list.innerHTML = '<div class="empty">실행 이력을 불러오는 중 오류가 발생했습니다.</div>';
    }
  }
  el("refresh-runs-btn").addEventListener("click", refreshRuns);

  (async function init(){
    var saved = await storeGet("gh_config");
    if (!saved) return;
    try{
      var cfg = JSON.parse(saved);
      el("repo-input").value = (cfg.owner || "") + (cfg.repo ? "/" + cfg.repo : "");
      el("pat-input").value = cfg.pat || "";
    }catch(e){}
  })();
})();
</script>
</body>
</html>
